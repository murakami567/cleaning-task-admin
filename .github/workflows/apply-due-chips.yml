name: Apply deadline chips

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-due-chips.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source change
        run: python .github/scripts/apply_due_chips.py
      - name: Remove migration files
        run: git rm .github/scripts/apply_due_chips.py .github/workflows/apply-due-chips.yml
      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 期限表示をチップ化"
          git push
