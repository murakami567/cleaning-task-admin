name: Promote patch implementations to production source

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-*.mjs"
      - "package.json"
      - ".github/workflows/promote-patches-to-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply existing patches once to source files
        run: |
          node scripts/patch-facility-photos.mjs
          node scripts/patch-admin-tasks-priority-display.mjs
          node scripts/patch-equipment-reports.mjs
          node scripts/patch-check-task-status.mjs
          node scripts/patch-admin-worklog-editor.mjs

      - name: Remove runtime patching from package scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts.dev = 'vite';
          pkg.scripts.build = 'vite build';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Remove obsolete patch scripts
        run: rm -f scripts/patch-*.mjs

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit production implementation
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src scripts .github/workflows/promote-patches-to-production.yml
          git commit -m "本番実装: ビルド時パッチをソースへ統合"
          git push
