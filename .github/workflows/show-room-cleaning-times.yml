name: Show room cleaning times
on:
  push:
    paths:
      - '.github/workflows/show-room-cleaning-times.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch worklog editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/admin/AdminWorklogEditor.tsx')
          s=p.read_text()
          old='''  work_minutes: number;\n  created_at?: string;\n};'''
          new='''  work_minutes: number;\n  created_at?: string;\n  cleaning_started_at?: string;\n  cleaning_completed_at?: string;\n  cleaning_minutes?: number;\n};'''
          if old not in s: raise SystemExit('worklog type point not found')
          s=s.replace(old,new,1)
          old='''  places: { property_name: string; room_name: string }[];'''
          new='''  places: {\n    property_name: string;\n    room_name: string;\n    cleaning_started_at?: string;\n    cleaning_completed_at?: string;\n    cleaning_minutes?: number;\n  }[];'''
          if old not in s: raise SystemExit('places type point not found')
          s=s.replace(old,new,1)
          old='''function uniquePlaces(rows: Worklog[]) {\n  const map = new Map<string, { property_name: string; room_name: string }>();\n  rows.forEach((row) => {\n    const key = `${row.property_name || ""}||${row.room_name || ""}`;\n    if (!map.has(key)) {\n      map.set(key, {\n        property_name: row.property_name || "",\n        room_name: row.room_name || "",\n      });\n    }\n  });\n  return Array.from(map.values());\n}\n'''
          new='''function uniquePlaces(rows: Worklog[]) {\n  const map = new Map<string, {\n    property_name: string;\n    room_name: string;\n    cleaning_started_at?: string;\n    cleaning_completed_at?: string;\n    cleaning_minutes?: number;\n  }>();\n  rows.forEach((row) => {\n    const key = `${row.property_name || ""}||${row.room_name || ""}`;\n    if (!map.has(key)) {\n      map.set(key, {\n        property_name: row.property_name || "",\n        room_name: row.room_name || "",\n        cleaning_started_at: row.cleaning_started_at || "",\n        cleaning_completed_at: row.cleaning_completed_at || "",\n        cleaning_minutes: Number(row.cleaning_minutes || 0),\n      });\n    }\n  });\n  return Array.from(map.values());\n}\n\nfunction formatTaskClock(value?: string) {\n  if (!value) return "";\n  const date = new Date(value);\n  if (Number.isNaN(date.getTime())) return "";\n  return date.toLocaleTimeString("ja-JP", {\n    hour: "2-digit",\n    minute: "2-digit",\n    hour12: false,\n    timeZone: "Asia/Tokyo",\n  });\n}\n\nfunction formatCleaningDuration(minutes?: number) {\n  const total = Math.max(Number(minutes || 0), 0);\n  if (!total) return "";\n  const h = Math.floor(total / 60);\n  const m = total % 60;\n  if (h <= 0) return `${m}分`;\n  if (m <= 0) return `${h}時間`;\n  return `${h}時間${m}分`;\n}\n'''
          if old not in s: raise SystemExit('uniquePlaces point not found')
          s=s.replace(old,new,1)
          old='''                                  <div className="text-sm font-bold text-slate-900">{place.property_name || "-"}</div>\n                                  <div className="mt-1 text-sm text-slate-500">{place.room_name || "-"}</div>\n'''
          new='''                                  <div className="text-sm font-bold text-slate-900">{place.property_name || "-"}</div>\n                                  <div className="mt-1 text-sm text-slate-500">{place.room_name || "-"}</div>\n                                  <div className="mt-2 border-t border-slate-100 pt-2">\n                                    <div className="text-[11px] font-semibold text-slate-400">清掃時間</div>\n                                    {place.cleaning_started_at && place.cleaning_completed_at ? (\n                                      <div className="mt-1 text-sm font-bold text-slate-800">\n                                        {formatTaskClock(place.cleaning_started_at)}〜{formatTaskClock(place.cleaning_completed_at)}\n                                        {Number(place.cleaning_minutes || 0) > 0 ? (\n                                          <span className="ml-2 text-xs font-semibold text-slate-500">\n                                            （{formatCleaningDuration(place.cleaning_minutes)}）\n                                          </span>\n                                        ) : null}\n                                      </div>\n                                    ) : place.cleaning_started_at ? (\n                                      <div className="mt-1 text-sm font-bold text-amber-600">\n                                        {formatTaskClock(place.cleaning_started_at)}〜 清掃中\n                                      </div>\n                                    ) : (\n                                      <div className="mt-1 text-xs text-slate-400">打刻なし</div>\n                                    )}\n                                  </div>\n'''
          if old not in s: raise SystemExit('place card point not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminWorklogEditor.tsx
          git commit -m "feat: 実働報告に部屋別清掃時間を表示"
          git rm .github/workflows/show-room-cleaning-times.yml
          git commit -m "chore: remove temporary migration workflow"
          git push
