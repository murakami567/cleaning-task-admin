name: Payroll print font size

on:
  push:
    paths:
      - '.github/workflows/payroll-print-font-size.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Increase payroll print font size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()
          s = s.replace('table-layout:fixed !important; font-size:6.5px !important;', 'table-layout:fixed !important; font-size:7.5px !important;')
          s = s.replace('        .print-area th, .print-area td { padding:4px 2px !important;', '        .print-area th, .print-area td { padding:4px 2.5px !important;')
          s = s.replace('        .print-area td:nth-child(3) span { white-space:nowrap !important;', '        .print-area td:nth-child(5), .print-area td:nth-child(6), .print-area td:nth-child(7), .print-area td:nth-child(8), .print-area td:nth-child(9), .print-area td:nth-child(10), .print-area td:nth-child(11) { font-size:8px !important; font-weight:600 !important; }\n        .print-area td:nth-child(3) span { white-space:nowrap !important;')
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/payroll-print-font-size.yml
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/payroll-print-font-size.yml
          git commit -m 'fix: 給与明細印刷の数値と文字サイズを拡大'
          git push
