name: Split individual payroll statement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-payroll-statement.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Split individual payroll statement
        run: python scripts/split_payroll_statement.py
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          rm -f scripts/split_payroll_statement.py .github/workflows/split-payroll-statement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 個別給与明細で単価分と時給換算分を分離" || exit 0
          git push
