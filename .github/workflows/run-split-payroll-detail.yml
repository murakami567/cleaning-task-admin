name: Run payroll detail split

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-split-payroll-detail.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/split_payroll_detail.py
      - run: npm install
      - run: npm run build
      - name: Commit changes
        run: |
          rm scripts/split_payroll_detail.py .github/workflows/run-split-payroll-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/PayrollAttendancePage.tsx scripts/split_payroll_detail.py .github/workflows/run-split-payroll-detail.yml
          git commit -m "feat: 給与詳細を単価分と時給換算分に分離"
          git push
