name: Widen payroll layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/widen-payroll-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update layout width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()
          old = '<div className="mx-auto max-w-7xl space-y-6">'
          new = '<div className="mx-auto w-full max-w-[1500px] space-y-6">'
          if old not in s:
              raise SystemExit('target layout class not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit source change and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/admin/PayrollAttendancePage.tsx
          git commit -m 'fix: 給与勤怠画面の横幅を拡張'
          git push origin main
          git rm .github/workflows/widen-payroll-layout.yml
          git commit -m 'chore: 一時レイアウト更新workflowを削除'
          git push origin main