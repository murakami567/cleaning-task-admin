name: Update payroll statement order
on:
  push:
    paths:
      - '.github/workflows/update-statement-order.yml'
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update statement
        run: python .github/scripts/update_statement_order.py
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          rm -f .github/scripts/update_statement_order.py .github/workflows/update-statement-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: 個別明細を単価順にし時給行から施設を除外'
          git push
