name: Group worklog reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/group-worklog-reports.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update worklog summary grouping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/AdminWorklogReportPage.tsx')
          s = p.read_text()
          old = '      const key = `${row.user_id}_${row.work_date}`;'
          new = '''      const key = [
        row.user_id,
        row.work_date,
        row.work_start_time,
        row.start_time,
        row.end_time,
        Number(row.break_minutes || 0),
        row.work_type || "",
        row.note || "",
      ].join("||");'''
          if old not in s:
              raise SystemExit('group key target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/group-worklog-reports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminWorklogReportPage.tsx .github/workflows/group-worklog-reports.yml
          git commit -m "feat: 実働報告集計を送信単位に統一"
          git push
