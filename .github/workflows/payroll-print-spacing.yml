name: Payroll print spacing

on:
  push:
    paths:
      - '.github/workflows/payroll-print-spacing.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update payroll print spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()
          s = s.replace('.print-area th:nth-child(3), .print-area td:nth-child(3) { width:8%; }', '.print-area th:nth-child(3), .print-area td:nth-child(3) { width:10%; }')
          s = s.replace('.print-area th:nth-child(4), .print-area td:nth-child(4) { width:24%; }', '.print-area th:nth-child(4), .print-area td:nth-child(4) { width:22%; }')
          s = s.replace('        .print-area thead { display:table-header-group; }', '        .print-area td:nth-child(3) span { white-space:nowrap !important; word-break:keep-all !important; overflow-wrap:normal !important; }\n        .print-area thead { display:table-header-group; }')
          s = s.replace('@page { size:A4 portrait; margin:7mm; }', '@page { size:A4 portrait; margin:10mm 12mm; }')
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/payroll-print-spacing.yml
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/payroll-print-spacing.yml
          git commit -m 'fix: 給与明細印刷の左右余白と区分表示を調整'
          git push
