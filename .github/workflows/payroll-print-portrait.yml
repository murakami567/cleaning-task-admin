name: Payroll print portrait

on:
  push:
    paths:
      - '.github/workflows/payroll-print-portrait.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update payroll print to portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()
          s = s.replace('@page { size:A4 landscape; margin:8mm; }', '@page { size:A4 portrait; margin:7mm; }')
          s = s.replace('font-size:8px !important;', 'font-size:6.5px !important;')
          s = s.replace('padding:5px 4px !important;', 'padding:4px 2px !important;')
          s = s.replace('.print-area .print-summary { grid-template-columns:repeat(4,1fr) !important; gap:6px !important; margin-bottom:10px !important; }', '.print-area .print-summary { grid-template-columns:repeat(4,1fr) !important; gap:4px !important; margin-bottom:8px !important; }')
          s = s.replace('.print-area .print-summary > div { padding:8px !important; box-shadow:none !important; border-radius:6px !important; }', '.print-area .print-summary > div { padding:6px !important; box-shadow:none !important; border-radius:4px !important; }')
          s = s.replace('.print-area .print-summary .text-2xl { font-size:16px !important; line-height:1.2 !important; }', '.print-area .print-summary .text-2xl { font-size:13px !important; line-height:1.15 !important; }')
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/payroll-print-portrait.yml
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/payroll-print-portrait.yml
          git commit -m 'fix: 個別給与明細をA4縦向きで印刷'
          git push
