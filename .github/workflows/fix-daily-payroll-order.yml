name: Fix daily payroll order

on:
  push:
    paths:
      - '.github/workflows/fix-daily-payroll-order.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_daily_payroll_order.py
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-daily-payroll-order.yml
          rm .github/scripts/fix_daily_payroll_order.py
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/fix-daily-payroll-order.yml .github/scripts/fix_daily_payroll_order.py
          git commit -m 'fix: 当日給与詳細の表示順を単価分から時給換算分に統一'
          git push
