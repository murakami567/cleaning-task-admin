name: Show payroll room details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/show-payroll-room-details.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update payroll daily and statement tables
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()

          s = s.replace(
              '  status: string;\n};',
              '  status: string;\n  note?: string;\n};',
              1,
          )

          old_daily_head = '<th className="px-3 py-3 text-left">施設</th><th className="px-3 py-3 text-right">部屋数</th>'
          new_daily_head = '<th className="px-3 py-3 text-left">施設</th><th className="px-3 py-3 text-left min-w-[300px]">完了部屋・時間内訳</th><th className="px-3 py-3 text-right">部屋数</th>'
          if old_daily_head not in s:
              raise SystemExit('daily header marker not found')
          s = s.replace(old_daily_head, new_daily_head, 1)

          old_daily_cell = '<td className="px-3 py-3">{r.facility}</td><td className="px-3 py-3 text-right">{r.room_count || ""}</td>'
          new_daily_cell = '<td className="px-3 py-3">{r.facility}</td><td className="px-3 py-3 text-xs leading-5 text-neutral-600">{r.note || "-"}</td><td className="px-3 py-3 text-right">{r.room_count || ""}</td>'
          if old_daily_cell not in s:
              raise SystemExit('daily cell marker not found')
          s = s.replace(old_daily_cell, new_daily_cell, 1)

          old_statement_head = '<th className="px-3 py-3 text-left">施設</th><th className="px-3 py-3 text-right">部屋数</th>'
          new_statement_head = '<th className="px-3 py-3 text-left">施設</th><th className="px-3 py-3 text-left min-w-[280px]">完了部屋・時間内訳</th><th className="px-3 py-3 text-right">部屋数</th>'
          if old_statement_head not in s:
              raise SystemExit('statement header marker not found')
          s = s.replace(old_statement_head, new_statement_head, 1)

          old_statement_cell = '<td className="px-3 py-3">{r.facility}</td><td className="px-3 py-3 text-right">{r.room_count || ""}</td>'
          new_statement_cell = '<td className="px-3 py-3">{r.facility}</td><td className="px-3 py-3 text-xs leading-5 text-neutral-600">{r.note || "-"}</td><td className="px-3 py-3 text-right">{r.room_count || ""}</td>'
          if old_statement_cell not in s:
              raise SystemExit('statement cell marker not found')
          s = s.replace(old_statement_cell, new_statement_cell, 1)

          # statement footer has one extra detail column now
          s = s.replace('colSpan={2}>合計</td>', 'colSpan={3}>合計</td>', 1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/show-payroll-room-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/show-payroll-room-details.yml
          git commit -m "feat: 給与確認に完了部屋と時間内訳を表示"
          git push
