name: Fix task CI CO persistence
on:
  push:
    paths:
      - '.github/workflows/fix-task-ci-co-persist.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch persistence keys
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/AdminTasksPagePreview.tsx"); s=p.read_text(); old="      \"date\",\n    ];"; new="      \"date\",\n      \"earlyCheckinTime\",\n      \"lateCheckoutTime\",\n    ];"; assert old in s; p.write_text(s.replace(old,new,1))'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminTasksPagePreview.tsx
          git commit -m "fix: アーリーCI・レイトCO時刻を保存"
          git push