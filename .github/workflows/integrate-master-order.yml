name: Integrate task order with property master

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integrate-master-order.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate master-based ordering into production source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/AdminTasksPagePreview.tsx')
          text = path.read_text()

          text = text.replace(
              'import { sortTasksByPropertyOrder } from "./utils/propertyOrder";\n',
              ''
          )

          old_state = '''  const [properties, setProperties] = useState<PropertyMaster[]>([]);
  const [rooms, setRooms] = useState<RoomMaster[]>([]);
  const [selectedPropertyId, setSelectedPropertyId] = useState("");'''
          new_state = '''  const [properties, setProperties] = useState<PropertyMaster[]>([]);
  const [rooms, setRooms] = useState<RoomMaster[]>([]);
  const [masterRooms, setMasterRooms] = useState<RoomMaster[]>([]);
  const [selectedPropertyId, setSelectedPropertyId] = useState("");'''
          if old_state not in text:
              raise SystemExit('state target not found')
          text = text.replace(old_state, new_state, 1)

          old_loader = '''  const loadProperties = async () => {
    const res = await fetch(`${API_BASE}/properties`);
    if (!res.ok) throw new Error(`properties fetch failed: ${res.status}`);
    const data: PropertyMaster[] = await res.json();
    setProperties(
      data
        .filter((p) => p.is_active)
        .sort((a, b) => (a.sort_order ?? 9999) - (b.sort_order ?? 9999))
    );
  };'''
          new_loader = '''  const loadProperties = async () => {
    const [propertyRes, roomRes] = await Promise.all([
      fetch(`${API_BASE}/properties`),
      fetch(`${API_BASE}/rooms`),
    ]);
    if (!propertyRes.ok) {
      throw new Error(`properties fetch failed: ${propertyRes.status}`);
    }
    if (!roomRes.ok) {
      throw new Error(`rooms fetch failed: ${roomRes.status}`);
    }

    const propertyData: PropertyMaster[] = await propertyRes.json();
    const roomData: RoomMaster[] = await roomRes.json();

    setProperties(
      propertyData
        .filter((p) => p.is_active)
        .sort((a, b) => (a.sort_order ?? 9999) - (b.sort_order ?? 9999))
    );
    setMasterRooms(roomData.filter((r) => r.is_active));
  };'''
          if old_loader not in text:
              raise SystemExit('loadProperties target not found')
          text = text.replace(old_loader, new_loader, 1)

          old_visible = '''  const visibleCleaningTasks = useMemo(() => {
  const list = Array.isArray(cleaningTasks) ? cleaningTasks : [];

  let tasks: CleaningTask[] = [];

  if (viewMode === "TODAY") {
    tasks = list.filter((t) => normalizeIsoDate(t.date) === baseDate);
  } else if (viewMode === "FUTURE") {
    tasks = list.filter((t) => isFutureDate(t.date));
  } else {
    tasks = list.filter((t) => normalizeIsoDate(t.date) === selectedDate);
  }

  return sortTasksByPropertyOrder(tasks, viewMode);
}, [cleaningTasks, viewMode, selectedDate]);'''
          new_visible = '''  const visibleCleaningTasks = useMemo(() => {
    const list = Array.isArray(cleaningTasks) ? cleaningTasks : [];

    let tasks: CleaningTask[] = [];

    if (viewMode === "TODAY") {
      tasks = list.filter((t) => normalizeIsoDate(t.date) === baseDate);
    } else if (viewMode === "FUTURE") {
      tasks = list.filter((t) => isFutureDate(t.date));
    } else {
      tasks = list.filter((t) => normalizeIsoDate(t.date) === selectedDate);
    }

    const propertyOrder = new Map<string, number>();
    const propertyIdByName = new Map<string, string>();
    properties.forEach((property, index) => {
      const order = property.sort_order ?? index + 1;
      propertyOrder.set(property.property_name, order);
      propertyIdByName.set(property.property_name, property.id);
      if (property.normalized_name) {
        propertyOrder.set(property.normalized_name, order);
        propertyIdByName.set(property.normalized_name, property.id);
      }
    });

    const roomOrder = new Map<string, number>();
    masterRooms.forEach((room, index) => {
      const order = room.room_sort_order ?? index + 1;
      roomOrder.set(`${room.property_id}::${room.room_name}`, order);
      if (room.room_code) {
        roomOrder.set(`${room.property_id}::${room.room_code}`, order);
      }
      roomOrder.set(`${room.property_id}::${room.room_key}`, order);
      if (room.normalized_room_key) {
        roomOrder.set(`${room.property_id}::${room.normalized_room_key}`, order);
      }
    });

    return [...tasks].sort((a, b) => {
      if (viewMode === "FUTURE") {
        const dateDiff = String(a.date || "").localeCompare(String(b.date || ""));
        if (dateDiff !== 0) return dateDiff;
      }

      const propertyOrderA = propertyOrder.get(a.property) ?? 999999;
      const propertyOrderB = propertyOrder.get(b.property) ?? 999999;
      if (propertyOrderA !== propertyOrderB) {
        return propertyOrderA - propertyOrderB;
      }

      if (propertyOrderA === 999999 && a.property !== b.property) {
        return a.property.localeCompare(b.property, "ja", { numeric: true });
      }

      const propertyIdA = propertyIdByName.get(a.property) || "";
      const propertyIdB = propertyIdByName.get(b.property) || "";
      const roomOrderA = roomOrder.get(`${propertyIdA}::${a.room}`) ?? 999999;
      const roomOrderB = roomOrder.get(`${propertyIdB}::${b.room}`) ?? 999999;
      if (roomOrderA !== roomOrderB) {
        return roomOrderA - roomOrderB;
      }

      return String(a.room || "").localeCompare(String(b.room || ""), "ja", {
        numeric: true,
      });
    });
  }, [cleaningTasks, viewMode, selectedDate, properties, masterRooms]);'''
          if old_visible not in text:
              raise SystemExit('visibleCleaningTasks target not found')
          text = text.replace(old_visible, new_visible, 1)

          path.write_text(text)
          PY

      - name: Remove obsolete fixed-order utility and this one-time workflow
        run: |
          rm -f src/utils/propertyOrder.ts
          rm -f .github/workflows/integrate-master-order.yml

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "本番実装: タスク一覧を物件管理の並び順へ連動"
          git push
