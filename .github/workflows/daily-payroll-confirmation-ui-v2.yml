name: Daily payroll confirmation UI v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-payroll-confirmation-ui-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch payroll page
        run: python -c "import base64;exec(base64.b64decode(''))"
      - run: npm install
      - run: npm run build
      - name: Commit changes and remove workflows
        run: |
          rm -f .github/workflows/daily-payroll-confirmation-ui-v2.yml .github/workflows/daily-payroll-confirmation-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/daily-payroll-confirmation-ui-v2.yml .github/workflows/daily-payroll-confirmation-ui.yml
          git commit -m "feat: 給与勤怠を当日スタッフ単位の確認画面へ変更"
          git push
