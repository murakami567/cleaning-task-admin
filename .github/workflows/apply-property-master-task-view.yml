name: Apply property master task view

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/apply-property-master-task-view.mjs"
      - ".github/workflows/apply-property-master-task-view.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escape nested template expressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-property-master-task-view.mjs")
          text = path.read_text(encoding="utf-8")
          text = text.replace("${room.property_id}", "\\${room.property_id}")
          text = text.replace("${propertyA?.id || \"\"}", "\\${propertyA?.id || \"\"}")
          text = text.replace("${propertyB?.id || \"\"}", "\\${propertyB?.id || \"\"}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply source migration
        run: node scripts/apply-property-master-task-view.mjs

      - name: Remove obsolete files
        run: |
          rm -f src/utils/propertyOrder.ts
          rm -f scripts/apply-property-master-task-view.mjs
          rm -f .github/workflows/apply-property-master-task-view.yml

      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: タスク表示を物件管理の順番とカラーへ連動"
          git push
