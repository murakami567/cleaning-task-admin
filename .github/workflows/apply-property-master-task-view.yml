name: Apply property master ordering and colors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-property-master-task-view.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update production source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/AdminTasksPagePreview.tsx")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'import { sortTasksByPropertyOrder } from "./utils/propertyOrder";\n',
              '',
          )

          property_type_old = '''type PropertyMaster = {
  id: string;
  property_code: string;
  property_name: string;
  normalized_name: string | null;
  sort_order: number | null;
  is_active: boolean;
};'''
          property_type_new = '''type PropertyMaster = {
  id: string;
  property_code: string;
  property_name: string;
  normalized_name: string | null;
  sort_order: number | null;
  task_color?: string | null;
  is_active: boolean;
};'''
          if property_type_old not in text:
              raise SystemExit("PropertyMaster target not found")
          text = text.replace(property_type_old, property_type_new, 1)

          color_pattern = re.compile(
              r'const PROPERTY_COLORS: Record<string, string> = \{.*?function getPropertyColor\(raw: string\) \{.*?\n\}',
              re.S,
          )
          color_replacement = '''function normalizePropertyLabel(raw: string) {
  return String(raw || "")
    .normalize("NFKC")
    .replace(/[\\s　]+/g, "")
    .trim();
}'''
          text, count = color_pattern.subn(color_replacement, text, count=1)
          if count != 1:
              raise SystemExit("legacy property color block not found")

          state_old = '''  const [properties, setProperties] = useState<PropertyMaster[]>([]);
  const [rooms, setRooms] = useState<RoomMaster[]>([]);
  const [selectedPropertyId, setSelectedPropertyId] = useState("");'''
          state_new = '''  const [properties, setProperties] = useState<PropertyMaster[]>([]);
  const [rooms, setRooms] = useState<RoomMaster[]>([]);
  const [masterRooms, setMasterRooms] = useState<RoomMaster[]>([]);
  const [selectedPropertyId, setSelectedPropertyId] = useState("");'''
          if state_old not in text:
              raise SystemExit("masterRooms state target not found")
          text = text.replace(state_old, state_new, 1)

          loader_pattern = re.compile(
              r'  const loadProperties = async \(\) => \{.*?\n  \};\n\n  const loadRooms = async',
              re.S,
          )
          loader_replacement = '''  const loadProperties = async () => {
    const [propertyRes, roomRes] = await Promise.all([
      fetch(`${API_BASE}/properties`),
      fetch(`${API_BASE}/rooms`),
    ]);

    if (!propertyRes.ok) {
      throw new Error(`properties fetch failed: ${propertyRes.status}`);
    }
    if (!roomRes.ok) {
      throw new Error(`rooms fetch failed: ${roomRes.status}`);
    }

    const propertyData: PropertyMaster[] = await propertyRes.json();
    const roomData: RoomMaster[] = await roomRes.json();

    setProperties(
      propertyData
        .filter((property) => property.is_active)
        .sort(
          (a, b) =>
            (a.sort_order ?? 999999) - (b.sort_order ?? 999999)
        )
    );
    setMasterRooms(roomData.filter((room) => room.is_active));
  };

  const loadRooms = async'''
          text, count = loader_pattern.subn(loader_replacement, text, count=1)
          if count != 1:
              raise SystemExit("loadProperties target not found")

          visible_pattern = re.compile(
              r'  const visibleCleaningTasks = useMemo\(\(\) => \{.*?\n\}, \[cleaningTasks, viewMode, selectedDate\]\);',
              re.S,
          )
          visible_replacement = '''  const resolveTaskProperty = (taskProperty: string) => {
    const key = normalizePropertyLabel(taskProperty);
    const exact = properties.find(
      (property) =>
        normalizePropertyLabel(property.property_name) === key ||
        normalizePropertyLabel(property.normalized_name || "") === key
    );
    if (exact) return exact;

    return properties.find((property) => {
      const names = [property.property_name, property.normalized_name]
        .map((name) => normalizePropertyLabel(name || ""))
        .filter(Boolean);
      return names.some(
        (name) => name.includes(key) || (key && key.includes(name))
      );
    });
  };

  const normalizeTaskColor = (value?: string | null) => {
    const color = String(value || "#ffffff").trim();
    return /^#[0-9a-fA-F]{6}$/.test(color) ? color : "#ffffff";
  };

  const visibleCleaningTasks = useMemo(() => {
    const list = Array.isArray(cleaningTasks) ? cleaningTasks : [];

    let tasks: CleaningTask[] = [];

    if (viewMode === "TODAY") {
      tasks = list.filter((task) => normalizeIsoDate(task.date) === baseDate);
    } else if (viewMode === "FUTURE") {
      tasks = list.filter((task) => isFutureDate(task.date));
    } else {
      tasks = list.filter(
        (task) => normalizeIsoDate(task.date) === selectedDate
      );
    }

    const roomOrder = new Map<string, number>();
    masterRooms.forEach((room, index) => {
      const order = room.room_sort_order ?? index + 1;
      [room.room_name, room.room_code, room.room_key, room.normalized_room_key]
        .filter(Boolean)
        .forEach((name) => {
          roomOrder.set(
            `${room.property_id}::${normalizePropertyLabel(String(name))}`,
            order
          );
        });
    });

    return [...tasks].sort((a, b) => {
      if (viewMode === "FUTURE") {
        const dateDiff = String(a.date || "").localeCompare(
          String(b.date || "")
        );
        if (dateDiff !== 0) return dateDiff;
      }

      const propertyA = resolveTaskProperty(a.property);
      const propertyB = resolveTaskProperty(b.property);
      const propertyOrderA = propertyA?.sort_order ?? 999999;
      const propertyOrderB = propertyB?.sort_order ?? 999999;

      if (propertyOrderA !== propertyOrderB) {
        return propertyOrderA - propertyOrderB;
      }

      if (!propertyA && !propertyB && a.property !== b.property) {
        return a.property.localeCompare(b.property, "ja", { numeric: true });
      }

      const roomOrderA =
        roomOrder.get(
          `${propertyA?.id || ""}::${normalizePropertyLabel(a.room || "")}`
        ) ?? 999999;
      const roomOrderB =
        roomOrder.get(
          `${propertyB?.id || ""}::${normalizePropertyLabel(b.room || "")}`
        ) ?? 999999;

      if (roomOrderA !== roomOrderB) {
        return roomOrderA - roomOrderB;
      }

      return String(a.room || "").localeCompare(String(b.room || ""), "ja", {
        numeric: true,
      });
    });
  }, [cleaningTasks, viewMode, selectedDate, properties, masterRooms]);'''
          text, count = visible_pattern.subn(visible_replacement, text, count=1)
          if count != 1:
              raise SystemExit("visibleCleaningTasks target not found")

          row_vars_old = '''                      const propertyColor = getPropertyColor(t.property);
                      const normalizedPropertyName = extractPropertyName(t.property);'''
          row_vars_new = '''                      const matchedProperty = resolveTaskProperty(t.property);
                      const propertyColor = normalizeTaskColor(
                        matchedProperty?.task_color
                      );'''
          if row_vars_old not in text:
              raise SystemExit("row color target not found")
          text = text.replace(row_vars_old, row_vars_new, 1)

          display_pattern = re.compile(
              r'''                          <Td>\n                            <div className="font-medium">\n                              \{normalizedPropertyName\}\n                            </div>\n                            \{normalizedPropertyName !== t\.property \? \(\n                              <div className="text-xs text-black/50">\n                                \{t\.property\}\n                              </div>\n                            \) : null\}\n                          </Td>'''
          )
          display_replacement = '''                          <Td>
                            <div className="font-medium">{t.property}</div>
                          </Td>'''
          text, count = display_pattern.subn(display_replacement, text, count=1)
          if count != 1:
              raise SystemExit("property display target not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove fixed-order utility and temporary workflow
        shell: bash
        run: |
          rm -f src/utils/propertyOrder.ts
          rm -f .github/workflows/apply-property-master-task-view.yml

      - name: Verify production build
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit production implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: タスク表示を物件管理の順番とカラーへ連動"
          git push
