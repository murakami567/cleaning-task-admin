name: Apply property master ordering and colors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-property-master-task-view.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update task page source
        shell: bash
        run: |
          echo ''' | base64 -d > /tmp/update_task_page.py
          python /tmp/update_task_page.py
          rm -f src/utils/propertyOrder.ts
          rm -f .github/workflows/apply-property-master-task-view.yml

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit source implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: タスク表示を物件管理の順番とカラーへ連動"
          git push
