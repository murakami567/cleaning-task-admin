name: Restore task page and apply property colors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-and-fix-property-colors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full task page and apply color fix
        shell: bash
        run: |
          set -euo pipefail
          git show 65ea6a1f284294b0aeb19b2489f20ee24ce42530:src/AdminTasksPagePreview.tsx > src/AdminTasksPagePreview.tsx
          python - <<'PY'
          from pathlib import Path

          path = Path("src/AdminTasksPagePreview.tsx")
          text = path.read_text(encoding="utf-8")

          keys_start = text.index("const PROPERTY_NAME_KEYS = [")
          keys_end = text.index("\n];", keys_start) + len("\n];")
          keys_replacement = "\n".join([
              "const PROPERTY_NAME_KEYS = Object.keys(PROPERTY_COLORS).sort(",
              "  (a, b) => b.length - a.length",
              ");",
          ])
          text = text[:keys_start] + keys_replacement + text[keys_end:]

          function_start = text.index("function extractPropertyName(raw: string) {")
          function_end = text.index("\n}\n\nfunction getPropertyColor", function_start) + len("\n}")
          function_replacement = "\n".join([
              "function normalizePropertyLabel(raw: string) {",
              "  return String(raw || \"\")",
              "    .normalize(\"NFKC\")",
              "    .replace(/[\\s　]+/g, \"\")",
              "    .trim();",
              "}",
              "",
              "function extractPropertyName(raw: string) {",
              "  const value = normalizePropertyLabel(raw);",
              "  if (!value) return \"\";",
              "",
              "  const found = PROPERTY_NAME_KEYS.find((name) => {",
              "    const normalizedName = normalizePropertyLabel(name);",
              "    return value.startsWith(normalizedName) || value.includes(normalizedName);",
              "  });",
              "  return found || value;",
              "}",
          ])
          text = text[:function_start] + function_replacement + text[function_end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove obsolete one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-property-colors.yml
          rm -f .github/workflows/integrate-master-order.yml
          rm -f .github/workflows/restore-and-fix-property-colors.yml

      - name: Verify production build
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit production implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: タスク画面を復元し物件色判定を本番実装"
          git push
