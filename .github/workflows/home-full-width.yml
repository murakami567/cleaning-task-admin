name: Home full width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-full-width.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update home layout width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/AdminHomePage.tsx')
          s = p.read_text()
          old = '<div className="mx-auto max-w-7xl space-y-6">'
          new = '<div className="w-full space-y-6">'
          if old not in s:
              raise SystemExit('home container marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/home-full-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminHomePage.tsx .github/workflows/home-full-width.yml
          git commit -m "feat: ホーム画面を画面幅に合わせて表示"
          git push
