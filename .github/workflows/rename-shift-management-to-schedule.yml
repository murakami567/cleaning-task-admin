name: Rename shift management to schedule

on:
  push:
    paths:
      - '.github/workflows/rename-shift-management-to-schedule.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rename visible labels
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace('<AdminNavButton to="/admin/shifts">シフト管理</AdminNavButton>', '<AdminNavButton to="/admin/shifts">スケジュール</AdminNavButton>')
          app.write_text(text)

          page = Path('src/ShiftManagementPage.tsx')
          text = page.read_text()
          text = text.replace('管理画面 ＞ シフト管理', '管理画面 ＞ スケジュール')
          text = text.replace('<div className="text-base font-extrabold mt-1">シフト管理</div>', '<div className="text-base font-extrabold mt-1">スケジュール</div>')
          page.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/rename-shift-management-to-schedule.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/ShiftManagementPage.tsx .github/workflows/rename-shift-management-to-schedule.yml
          git commit -m "refactor: シフト管理をスケジュールへ名称変更"
          git push origin main
