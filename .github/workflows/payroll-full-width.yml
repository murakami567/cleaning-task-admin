name: Payroll full width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payroll-full-width.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make payroll page fit viewport width
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()
          old = 'className="mx-auto w-full max-w-[1500px] space-y-6"'
          new = 'className="w-full space-y-6"'
          if old not in s:
              raise SystemExit('target class not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm install
      - run: npm run build
      - name: Commit change and remove workflow
        run: |
          rm .github/workflows/payroll-full-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/payroll-full-width.yml
          git commit -m "fix: 給与勤怠を画面幅に合わせて表示"
          git push
