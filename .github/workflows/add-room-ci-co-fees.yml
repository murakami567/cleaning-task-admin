name: Add room CI CO fee UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-room-ci-co-fees.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/property-management/types.ts')
          s=p.read_text()
          s=s.replace('  note?: string | null;\n};', '  note?: string | null;\n  early_checkin_fee?: number | null;\n  late_checkout_fee?: number | null;\n};', 1)
          p.write_text(s)

          p=Path('src/PropertyManagementPage.tsx')
          s=p.read_text()
          s=s.replace('  note: "",\n};', '  note: "",\n  early_checkin_fee: "0",\n  late_checkout_fee: "0",\n};', 1)
          s=s.replace('      note: form.note.trim() || null,\n    };', '      note: form.note.trim() || null,\n      early_checkin_fee: Math.max(Number(form.early_checkin_fee || 0), 0),\n      late_checkout_fee: Math.max(Number(form.late_checkout_fee || 0), 0),\n    };', 1)
          s=s.replace('      note: room.note ?? "",\n    });', '      note: room.note ?? "",\n      early_checkin_fee: String(room.early_checkin_fee ?? 0),\n      late_checkout_fee: String(room.late_checkout_fee ?? 0),\n    });', 1)
          marker='''      <div className="grid grid-cols-2 gap-3">\n        <Field label="キーボックス番号">'''
          insert='''      <div className="grid grid-cols-2 gap-3">\n        <Field label="アーリーCI料金（円）">\n          <TextInput\n            type="number"\n            value={roomForm.early_checkin_fee}\n            onChange={(value) =>\n              setRoomForm((current) => ({ ...current, early_checkin_fee: value }))\n            }\n          />\n        </Field>\n        <Field label="レイトCO料金（円）">\n          <TextInput\n            type="number"\n            value={roomForm.late_checkout_fee}\n            onChange={(value) =>\n              setRoomForm((current) => ({ ...current, late_checkout_fee: value }))\n            }\n          />\n        </Field>\n      </div>\n'''+marker
          if marker not in s: raise SystemExit('room form marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s)

          p=Path('src/pages/employee/EmployeeTasksPage.tsx')
          s=p.read_text()
          # RateBox already receives rateCi/rateCo; format numeric master fees as yen in the existing component.
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/PropertyManagementPage.tsx src/property-management/types.ts
          git commit -m 'feat: 部屋管理にアーリーCI・レイトCO料金を追加'
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/add-room-ci-co-fees.yml
          git commit -m 'chore: remove room fee UI migration workflow'
          git push
