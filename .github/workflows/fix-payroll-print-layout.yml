name: Fix payroll print layout

on:
  push:
    paths:
      - '.github/workflows/fix-payroll-print-layout.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python .github/scripts/fix_payroll_print_layout.py
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-payroll-print-layout.yml .github/scripts/fix_payroll_print_layout.py
          git add src/pages/admin/PayrollAttendancePage.tsx .github/workflows/fix-payroll-print-layout.yml .github/scripts/fix_payroll_print_layout.py
          git commit -m 'fix: 個別給与明細をA4明細表として印刷できるよう調整'
          git push
