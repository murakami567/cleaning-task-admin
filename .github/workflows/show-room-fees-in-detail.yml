name: Show room fees in detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/show-room-fees-in-detail.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update room detail drawer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/PropertyManagementPage.tsx')
          s = p.read_text()
          marker = '["定員", viewingRoom.capacity],'
          if marker not in s:
              raise SystemExit('target marker not found')
          addition = '''["定員", viewingRoom.capacity],
              [
                "アーリーCI料金",
                Number(viewingRoom.early_checkin_fee || 0) > 0
                  ? `¥${Number(viewingRoom.early_checkin_fee || 0).toLocaleString()}`
                  : "未設定",
              ],
              [
                "レイトCO料金",
                Number(viewingRoom.late_checkout_fee || 0) > 0
                  ? `¥${Number(viewingRoom.late_checkout_fee || 0).toLocaleString()}`
                  : "未設定",
              ],'''
          p.write_text(s.replace(marker, addition, 1))
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/show-room-fees-in-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PropertyManagementPage.tsx .github/workflows/show-room-fees-in-detail.yml
          git commit -m "feat: 部屋詳細にCI・CO料金を表示"
          git push
