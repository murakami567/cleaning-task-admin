name: Patch contractor assignee candidates

on:
  push:
    paths:
      - '.github/workflows/patch-contractor-assignee-candidates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch AdminTasksPagePreview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/AdminTasksPagePreview.tsx')
          text = path.read_text()

          old = '''async function fetchAvailableStaffByDate(shiftDate: string): Promise<Attendee[]> {
  const res = await fetch(`${API_BASE}/shifts?shift_date=${shiftDate}`);
  if (!res.ok) throw new Error(`shift fetch failed: ${res.status}`);

  const data = await res.json();

  const day = Array.isArray(data) ? data[0] : data;
  if (!day) return [];

  const entries = Array.isArray(day.shift_entries) ? day.shift_entries : [];

  // 出勤のみ (遅刻は対応エリア絞り込みの対象外なので除外)
  return entries
    .filter((e: any) => e.status === "出勤")
    .map((e: any) => ({
      userId: e.staff_id,
      name: e.staff_members?.staff_name || e.staff_id,
      availablePropertyIds: Array.isArray(e.staff_members?.available_property_ids)
        ? e.staff_members.available_property_ids
        : [],
      uncheckedPropertyIds: Array.isArray(e.staff_members?.unchecked_property_ids)
        ? e.staff_members.unchecked_property_ids
        : [],
    }));
}
'''

          new = '''async function fetchAvailableStaffByDate(shiftDate: string): Promise<Attendee[]> {
  const [shiftRes, staffRes] = await Promise.all([
    fetch(`${API_BASE}/shifts?shift_date=${shiftDate}`),
    fetch(`${API_BASE}/staffs`),
  ]);
  if (!shiftRes.ok) throw new Error(`shift fetch failed: ${shiftRes.status}`);
  if (!staffRes.ok) throw new Error(`staff fetch failed: ${staffRes.status}`);

  const data = await shiftRes.json();
  const staffData = await staffRes.json();

  const day = Array.isArray(data) ? data[0] : data;
  const entries = Array.isArray(day?.shift_entries) ? day.shift_entries : [];

  // 通常スタッフはその日の「出勤」のみ。
  const attendees: Attendee[] = entries
    .filter((e: any) => e.status === "出勤")
    .map((e: any) => ({
      userId: e.staff_id,
      name: e.staff_members?.staff_name || e.staff_id,
      availablePropertyIds: Array.isArray(e.staff_members?.available_property_ids)
        ? e.staff_members.available_property_ids
        : [],
      uncheckedPropertyIds: Array.isArray(e.staff_members?.unchecked_property_ids)
        ? e.staff_members.unchecked_property_ids
        : [],
    }));

  // 委託業者はシフトに関係なく担当候補へ追加する。
  // 後段の物件フィルタで、対応物件に紐づく委託業者だけが各タスクに表示される。
  const contractors: Attendee[] = (Array.isArray(staffData) ? staffData : [])
    .filter((staff: any) => staff?.role === "contractor" && staff?.is_active !== false)
    .map((staff: any) => ({
      userId: staff.id,
      name: staff.staff_name || staff.id,
      availablePropertyIds: Array.isArray(staff.available_property_ids)
        ? staff.available_property_ids
        : [],
      uncheckedPropertyIds: Array.isArray(staff.unchecked_property_ids)
        ? staff.unchecked_property_ids
        : [],
    }));

  const merged = [...attendees, ...contractors];
  return Array.from(new Map(merged.map((staff) => [staff.userId, staff])).values());
}
'''

          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/patch-contractor-assignee-candidates.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminTasksPagePreview.tsx .github/workflows/patch-contractor-assignee-candidates.yml
          git commit -m "fix: 清掃タスクの担当候補に委託業者を追加"
          git push origin main
