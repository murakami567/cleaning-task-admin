name: Fix task property colors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-property-colors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix property color lookup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/AdminTasksPagePreview.tsx')
          text = path.read_text()

          start = text.index('const PROPERTY_NAME_KEYS = [')
          end = text.index('\n];', start) + len('\n];')
          replacement = '''const PROPERTY_NAME_KEYS = Object.keys(PROPERTY_COLORS).sort(
  (a, b) => b.length - a.length
);'''
          text = text[:start] + replacement + text[end:]

          old = '''function extractPropertyName(raw: string) {
  const value = String(raw || "").trim();
  if (!value) return "";

  const found = PROPERTY_NAME_KEYS.find(
    (name) => value.startsWith(name) || value.includes(name)
  );
  return found || value;
}'''
          new = '''function normalizePropertyLabel(raw: string) {
  return String(raw || "")
    .normalize("NFKC")
    .replace(/[\\s　]+/g, "")
    .trim();
}

function extractPropertyName(raw: string) {
  const value = normalizePropertyLabel(raw);
  if (!value) return "";

  const found = PROPERTY_NAME_KEYS.find((name) => {
    const normalizedName = normalizePropertyLabel(name);
    return value.startsWith(normalizedName) || value.includes(normalizedName);
  });
  return found || value;
}'''
          if old not in text:
            raise SystemExit('extractPropertyName target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-property-colors.yml

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "タスク物件色を全物件名へ対応"
          git push
