name: Payroll print category size
on:
  push:
    paths:
      - '.github/workflows/payroll-print-category-size.yml'
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reduce payroll print category label size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/PayrollAttendancePage.tsx')
          s = p.read_text()
          old = '.print-area td:nth-child(3) span { white-space:nowrap !important; word-break:keep-all !important; overflow-wrap:normal !important; }'
          new = '.print-area td:nth-child(3) span { white-space:nowrap !important; word-break:keep-all !important; overflow-wrap:normal !important; font-size:6.5px !important; line-height:1 !important; padding:2px 5px !important; }'
          if old not in s:
              raise SystemExit('target print category style not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm install
      - run: npm run build
      - name: Commit changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/PayrollAttendancePage.tsx
          git commit -m "fix: 給与明細の区分表示を小さく調整"
          git push
          git rm .github/workflows/payroll-print-category-size.yml
          git commit -m "chore: remove payroll print category size workflow"
          git push